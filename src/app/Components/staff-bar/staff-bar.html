@if (groups().length > 0) {
  <nav class="sb" aria-label="Staff tools">
    <div class="sb-inner">
      <span class="sb-tag"><i class="fas fa-screwdriver-wrench"></i> Staff</span>

      @for (group of groups(); track group.title) {
        @if (group.items.length === 1) {
          <!-- one tool: a plain link -->
          <a class="sb-link" [class.active]="isActive(group.items[0])"
             [routerLink]="group.items[0].path" [queryParams]="group.items[0].query ?? {}">
            <i class="fas" [class]="'fas ' + group.items[0].icon"></i> {{ group.items[0].label }}
          </a>
        } @else {
          <!-- several tools: a small menu -->
          <div class="sb-menu">
            <button type="button" class="sb-link" [class.active]="groupActive(group.items)" [class.open]="open() === group.title"
                    [attr.aria-expanded]="open() === group.title" aria-haspopup="true" (click)="toggle(group.title)">
              <i class="fas" [class]="'fas ' + group.icon"></i> {{ group.title }}
              <i class="fas fa-chevron-down caret"></i>
            </button>
            @if (open() === group.title) {
              <div class="sb-panel" role="menu" [attr.aria-label]="group.title">
                @for (item of group.items; track item.label) {
                  <a role="menuitem" class="sb-item" [class.active]="isActive(item)"
                     [routerLink]="item.path" [queryParams]="item.query ?? {}">
                    <span class="sb-icon"><i class="fas" [class]="'fas ' + item.icon"></i></span>
                    <span class="sb-text">
                      <strong>{{ item.label }}</strong>
                      @if (item.hint) { <small>{{ item.hint }}</small> }
                    </span>
                  </a>
                }
              </div>
            }
          </div>
        }
      }
    </div>
  </nav>
}
